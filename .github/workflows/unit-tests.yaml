name: PR 744 Windows CI diagnosis
on:
  workflow_dispatch:
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: 11
          distribution: temurin
          cache: maven
      - name: Run unchanged acceptance checks
        run: mvn -B -Pjdk11 -am -pl jvector-tests test "-Ddiagnostic.output=ci-failure-evidence"
      - name: Preserve results and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-jdk11-attempt-${{ matrix.attempt }}
          path: |
            **/target/surefire-reports/**
            **/ci-failure-evidence/**
